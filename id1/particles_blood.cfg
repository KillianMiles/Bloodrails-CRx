r_part t_gib    //GIBS
{
	texture "particles/large"  //large
	step 1.8	//distance between particles (controls density)
	scale 6 8	//particle scale 7-10
	die 1.68		//how long the particles hang around
	alpha 0.80	//initial alpha
	alpharand 0.2	//random additional initial alpha
	alphadelta -0.59
	scaledelta -3.75 	//specifies the change in the particle scale per second
	scalefactor 0.7	//1 makes the particle scale the same as anything else and zero keeps size constant
	randomvel 2
	veladd 1
	//orgadd 45
	colorindex 68 11    //(red 68 11) (dark orange 226 6) (blue 244 2)
	gravity 40
	spawnorg 2
	stains 1
	assoc g_particle
}

